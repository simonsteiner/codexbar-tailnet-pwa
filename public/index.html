<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>CodexBar</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <h1 class="brand">
    <button id="health" class="health-btn" aria-label="CodexBar — service status" title="Service status">
      <span id="health-dot" class="brand-dot"></span>
      CodexBar
      <span id="update-pill" class="update-pill" hidden>Update</span>
    </button>
  </h1>
  <div class="topbar-actions">
    <button id="notify" class="notify-btn" aria-label="Push notifications" title="Push notifications">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="notify-dot" class="notify-dot" hidden></span>
    </button>
    <button id="refresh" class="refresh" aria-label="Refresh" title="Refresh snapshot">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>

<nav class="views" role="tablist" aria-label="View">
  <button class="view-btn" role="tab" data-view="cards">Cards</button>
  <button class="view-btn" role="tab" data-view="resets">Resets</button>
  <button class="view-btn" role="tab" data-view="dense">Dense</button>
  <button class="view-btn" role="tab" data-view="spend">Spend</button>
</nav>

<div id="status" class="status" hidden></div>
<main id="content" class="content" aria-live="polite"></main>
<footer class="meta">
  <div id="meta"></div>
  <div id="about" class="about"></div>
</footer>

<dialog id="notify-dialog" class="notify-dialog">
  <div class="dialog-card">
    <div class="dialog-head">
      <h2>Push Notifications</h2>
      <button id="notify-close" class="dialog-close" aria-label="Close">&times;</button>
    </div>
    <p class="dialog-desc">Get notified on your device when a rate limit window is renewed.</p>
    <div id="notify-info" class="notify-info">Checking notification status…</div>
    <div class="dialog-actions">
      <button id="notify-toggle" class="btn btn-primary">Enable Notifications</button>
      <button id="notify-test" class="btn btn-secondary" hidden>Send Test Notification</button>
    </div>
  </div>
</dialog>

<dialog id="health-dialog" class="notify-dialog">
  <div class="dialog-card">
    <div class="dialog-head">
      <h2>Status</h2>
      <button id="health-close" class="dialog-close" aria-label="Close">&times;</button>
    </div>
    <dl id="health-info" class="health-info"><dt>Health</dt><dd>Checking…</dd></dl>
    <div id="health-actions" class="health-actions"></div>
  </div>
</dialog>

<script src="/app.js" type="module"></script>
</body>
</html>
