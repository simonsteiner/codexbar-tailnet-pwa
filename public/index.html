<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0c" />
<title>CodexBar</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-dot"></span>
    <h1>CodexBar</h1>
  </div>
  <button id="refresh" class="refresh" aria-label="Refresh">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<nav class="views" role="tablist" aria-label="View">
  <button class="view-btn" role="tab" data-view="cards">Cards</button>
  <button class="view-btn" role="tab" data-view="resets">Resets</button>
  <button class="view-btn" role="tab" data-view="dense">Dense</button>
</nav>

<div id="status" class="status" hidden></div>
<main id="content" class="content" aria-live="polite"></main>
<footer id="meta" class="meta"></footer>

<script src="/app.js" type="module"></script>
</body>
</html>
